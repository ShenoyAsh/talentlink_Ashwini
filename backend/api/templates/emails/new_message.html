
{% block content %}
  <h2 style="font-size: 20px; color: #333;">You Have a New Message</h2>
  <p style="font-size: 16px; color: #555;">
    Hi {{ user_name }},
  </p>
  <p style="font-size: 16px; color: #555;">
    You have received a new message from <strong>{{ sender_name }}</strong>.
  </p>
  <p style="font-size: 16px; color: #555;">
    <a href="{{ site_url }}/messages" class="button-link">View Message</a>
  </p>
  <p style="font-size: 16px; color: #555;">
    Please log in to your account to read and reply to the message.
  </p>
  <p style="font-size: 16px; color: #555;">
    Thank you,<br>
    The TalentLink Team
  </p>
{% endblock %}
